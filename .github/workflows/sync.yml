name: Sync Upstream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inject-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查 mod 目录
        run: |
          echo "=== mod/ ==="
          ls -la mod/
          echo "=== mod/assets/ ==="
          ls -la mod/assets/
          test -f mod/inject-notify-channels.mjs
          test -d mod/assets
          test -f mod/assets/dispatch.js
          test -f mod/assets/index.js
          test -f mod/assets/scheduler.js
          test -f mod/assets/subscriptions.js
          test -f mod/assets/subscriptions.handler.js
          test -f mod/assets/adminPage.html
          echo "mod 目录检查通过"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 注入 mod 补丁
        run: node mod/inject-notify-channels.mjs

      - name: 确认注入结果
        run: |
          grep -n "normalizeNotifyChannels" src/services/notify/dispatch.js | head -3
          grep -n "notifyChannelsUseGlobal" src/views/adminPage.html | head -3
          grep -n "notifyChannels" src/services/scheduler.js | head -3
          grep -n "normalizeNotifyChannels(subscription.notifyChannels)" src/data/subscriptions.js | head -3
          grep -n "subscription.notifyChannels" src/api/handlers/subscriptions.js | head -3
          echo "注入确认通过"

      - name: Lint + Test
        run: |
          npm run lint
          npm test

      - name: 部署到 Cloudflare Workers
        run: npm run deploy:safe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
