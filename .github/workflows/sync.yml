name: Sync Upstream

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/wangwangit/SubsTracker.git || true

      - name: Fetch repositories
        run: |
          git fetch origin master
          git fetch upstream master

      - name: Backup local sync workflow
        run: |
          mkdir -p /tmp/workflow_backup
          cp .github/workflows/sync.yml /tmp/workflow_backup/sync.yml

      - name: Sync upstream master
        run: |
          git checkout master
          git reset --hard upstream/master

      - name: Restore local sync workflow
        run: |
          mkdir -p .github/workflows
          cp /tmp/workflow_backup/sync.yml .github/workflows/sync.yml
          git add .github/workflows/sync.yml

      - name: Check changes
        id: changes
        run: |
          if git diff --cached --quiet && git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit upstream changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add .
          git commit -m "Sync upstream changes"
          git push origin master --force-with-lease

      - name: Trigger deploy workflow
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'master'
            })
